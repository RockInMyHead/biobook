name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
    paths:
      - "web/**"
      - ".github/workflows/ci.yml"

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: Syntax & smoke import
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install minimal runtime deps
        run: |
          python -m pip install --upgrade pip
          pip install fastapi uvicorn jinja2 python-multipart sqlalchemy httpx

      - name: Byte-compile
        run: python -m compileall -q -f .

      - name: Import app
        env:
          BASE_PATH: ""
          SITE_ORIGIN: https://labjournal.tech
        run: |
          python - <<'PY'
          import app
          assert hasattr(app, "app")
          print("import ok:", type(app.app).__name__)
          PY
