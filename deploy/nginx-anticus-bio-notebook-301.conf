# Фрагмент для anticus.tech (VK Cloud / 95.163.215.131):
# старый путь /bio-notebook → канон labjournal.tech без префикса.
#
# Вставить внутрь server { server_name anticus.tech ... } ПЕРЕД location /,
# затем: nginx -t && systemctl reload nginx
#
# Примеры:
#   /bio-notebook      → https://labjournal.tech/
#   /bio-notebook/     → https://labjournal.tech/
#   /bio-notebook/guides/ → https://labjournal.tech/guides/

location = /bio-notebook {
    return 301 https://labjournal.tech/;
}
location = /bio-notebook/ {
    return 301 https://labjournal.tech/;
}
location ^~ /bio-notebook/ {
    rewrite ^/bio-notebook/?(.*)$ https://labjournal.tech/$1 permanent;
}
