# labjournal.tech — канонический домен Bio-Notebook
# Старый bionotebook.ru → 301 на labjournal.tech
# IP / неизвестный Host → 444
#
# Перед включением SSL:
#   1) A-запись labjournal.tech → 176.109.103.209
#   2) A или CNAME www.labjournal.tech → тот же IP / apex
#   3) sudo certbot certonly --webroot -w /var/www/letsencrypt \
#        -d labjournal.tech -d www.labjournal.tech
#   4) скопировать этот файл в sites-available, nginx -t && reload
#   5) SITE_ORIGIN=https://labjournal.tech в /etc/biobook.env + restart biobook

server {
    listen 80 default_server;
    listen [::]:80 default_server;
    listen 443 ssl http2 default_server;
    listen [::]:443 ssl http2 default_server;
    server_name _;
    ssl_certificate     /etc/letsencrypt/live/labjournal.tech/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/labjournal.tech/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;
    return 444;
}

# ACME + http→https для нового домена
server {
    listen 80;
    listen [::]:80;
    server_name labjournal.tech www.labjournal.tech;
    location /.well-known/acme-challenge/ {
        root /var/www/letsencrypt;
    }
    location / {
        return 301 https://labjournal.tech$request_uri;
    }
}

# www → apex
server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name www.labjournal.tech;
    ssl_certificate     /etc/letsencrypt/live/labjournal.tech/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/labjournal.tech/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;
    return 301 https://labjournal.tech$request_uri;
}

# Канонический сайт
server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name labjournal.tech;

    ssl_certificate     /etc/letsencrypt/live/labjournal.tech/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/labjournal.tech/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    client_max_body_size 50M;
    add_header Strict-Transport-Security "max-age=31536000" always;

    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 5;
    gzip_min_length 1024;
    gzip_types text/plain text/css text/javascript application/javascript application/json application/xml image/svg+xml;

    location /.well-known/acme-challenge/ {
        root /var/www/letsencrypt;
    }

    # Legacy mount → apex (как на anticus.tech)
    location = /bio-notebook {
        return 301 https://labjournal.tech/;
    }
    location = /bio-notebook/ {
        return 301 https://labjournal.tech/;
    }
    location ^~ /bio-notebook/ {
        rewrite ^/bio-notebook/?(.*)$ https://labjournal.tech/$1 permanent;
    }

    location /static/uploads/ {
        proxy_pass http://127.0.0.1:3001;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        add_header Strict-Transport-Security "max-age=31536000" always;
    }

    location = /static/site.webmanifest {
        alias /opt/bio-notebook/web/static/site.webmanifest;
        default_type application/manifest+json;
        expires 7d;
        add_header Cache-Control "public";
        add_header Strict-Transport-Security "max-age=31536000" always;
        access_log off;
    }

    location /static/ {
        alias /opt/bio-notebook/web/static/;
        expires 7d;
        add_header Cache-Control "public";
        add_header Strict-Transport-Security "max-age=31536000" always;
        access_log off;
    }

    location / {
        proxy_pass http://127.0.0.1:3001;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_redirect off;
        proxy_connect_timeout 30s;
        proxy_send_timeout 120s;
        proxy_read_timeout 120s;
        add_header Strict-Transport-Security "max-age=31536000" always;
    }
}

