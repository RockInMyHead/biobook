# Временный HTTP-блок: положить в /etc/nginx/sites-available/labjournal-http
# и symlink в sites-enabled. Нужен, пока нет SSL-серта labjournal.tech.
# После certbot — заменить весь bio-notebook на nginx-labjournal.tech.conf.

server {
    listen 80;
    listen [::]:80;
    server_name labjournal.tech www.labjournal.tech;

    location /.well-known/acme-challenge/ {
        root /var/www/letsencrypt;
    }

    # Пока нет сертификата — отдаём сайт по HTTP (после DNS A).
    # www тоже проксируем; канон сделает middleware / финальный nginx.
    location / {
        proxy_pass http://127.0.0.1:3001;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_redirect off;
        proxy_connect_timeout 30s;
        proxy_send_timeout 120s;
        proxy_read_timeout 120s;
    }
}
